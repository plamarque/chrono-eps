name: Release to Stores

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pour gh release create
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pour git log entre tags

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          PREV=$(git tag -l --sort=-v:refname | sed -n 2p)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log "$PREV..$TAG" --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log "$TAG" --pretty=format:"- %s (%h)" -30)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Aucun commit depuis le dernier tag"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "## Changements" > notes.md
          echo "" >> notes.md
          echo "${{ steps.changelog.outputs.changelog }}" >> notes.md
          gh release create "$TAG" --notes-file notes.md

  build-android:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write  # pour gh release upload
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-twa/android.keystore

      - name: Install dependencies
        run: npm ci

      - name: Build Android AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: npm run android:bundle

      - name: Upload to Play Store (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: io.github.plamarque.twa
          releaseFiles: dist/chrono-eps-android.aab
          track: internal

      - name: Attach AAB to GitHub release
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" dist/chrono-eps-android.aab --clobber

  build-ios:
    runs-on: macos-14
    needs: create-release
    permissions:
      contents: write  # pour gh release upload
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        run: bundle install
        working-directory: ios

      - name: Build and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta
        working-directory: ios

      - name: Attach IPA to GitHub release
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" ios/build/ChronoEPS.ipa --clobber

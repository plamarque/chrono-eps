name: Promote to Stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la version à promouvoir (ex. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote internal Play release to production
        env:
          PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          PROMOTE_TAG: ${{ inputs.tag }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/promote-android-production.py

  promote-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        run: bundle install
        working-directory: ios

      - name: Promote to App Store (submit for review)
        working-directory: ios
        env:
          CI: "true"
          LANG: "en_US.UTF-8"
          LC_ALL: "en_US.UTF-8"
          PROMOTE_TAG: ${{ inputs.tag }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: bundle exec fastlane promote
